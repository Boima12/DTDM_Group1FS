services:
  mongo:
    image: mongo:7
    container_name: group1fs-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - group1fs_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  group1fs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: group1fs-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/GROUP1FS}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-GROUP1FS}
      JWT_SECRET: ${JWT_SECRET:-group1fs-local-demo-secret-key-2026}
      STORAGE_QUOTA_BYTES: 5368709120
      MAX_FILE_SIZE_BYTES: 104857600
      TRASH_RETENTION_DAYS: 30
      ENABLE_DEMO_AUTO_LOGIN: "true"

volumes:
  group1fs_mongo_data:
